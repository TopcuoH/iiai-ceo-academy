name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Perm Work catalog
        shell: bash
        run: |
          node --check perm-workspaces/data.js
          node --check perm-workspaces/events.js
          node --check perm-workspaces/app.js
          node --check perm-workspaces/v2.js
          node --check perm-workspaces/v2-fix.js
          node --check perm-workspaces/v3.js
          node --check perm-workspaces/v4.js
          node --check perm-workspaces/v5.js
          node --check perm-workspaces/v6.js
          node -e "JSON.parse(require('fs').readFileSync('perm-workspaces/manifest.webmanifest','utf8'))"
          if grep -R "Яблочкова" perm-workspaces; then
            echo "Old location binding found in Perm Work catalog"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
